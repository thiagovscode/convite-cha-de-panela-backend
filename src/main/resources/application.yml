spring:
  application:
    name: convite-backend
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/convite_db}

server:
  port: 8080

app:
  security:
    jwt:
      secret: ${JWT_SECRET:princesadiaries2026-super-secret-key-that-must-be-long-enough-fallback}
      expiration: 86400000 # 24 horas

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
